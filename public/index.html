<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veyra</title>
  <link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="app">

  <header class="topbar">
    <div class="brand">Veyra</div>

    <div class="top-search">
      <input id="searchInput" placeholder="Rechercher un utilisateur...">
      <div id="searchResults"></div>
    </div>

    <button id="logoutBtn" class="ghost">Déconnexion</button>
  </header>

  <main>

    <section id="homePage" class="page active">

      <div class="hero">
        <div>
          <span class="eyebrow">TON ESPACE</span>
          <h1>Bienvenue sur Veyra</h1>
          <p>Partage, discute et retrouve tes amis.</p>
        </div>

        <button id="addStoryBtn" class="primary">
          + Ajouter
        </button>
      </div>

      <section class="stories-section">
        <div class="section-title">
          <h2>Stories</h2>
          <button id="allStoriesBtn" class="text-btn">
            Tout voir
          </button>
        </div>

        <div id="stories" class="stories-row"></div>
      </section>

      <section class="feed-section">
        <div class="section-title">
          <h2>Publications</h2>
        </div>

        <div class="composer">
          <textarea
            id="postText"
            placeholder="Quoi de neuf ?"
          ></textarea>

          <div class="composer-bottom">
            <label class="file-btn">
              📎 Ajouter un fichier
              <input id="postFile" type="file" hidden>
            </label>

            <span id="postFileName"></span>

            <button id="publishBtn" class="primary">
              Publier
            </button>
          </div>
        </div>

        <div id="posts" class="feed"></div>
      </section>

    </section>


    <section id="storiesPage" class="page">

      <div class="page-head">
        <div>
          <span class="eyebrow">STORIES</span>
          <h1>Toutes les stories</h1>
        </div>

        <button id="addStoryBtn2" class="primary">
          + Ajouter une story
        </button>
      </div>

      <div id="storiesFull" class="stories-grid"></div>

    </section>


    <section id="chatPage" class="page">

      <div class="chat-layout">

        <aside class="chat-sidebar">
          <div class="chat-sidebar-head">
            <h2>Discussions</h2>
            <button id="publicChatBtn" class="small-btn">
              🌐 Public
            </button>
          </div>

          <div id="conversationList"></div>

          <div class="room-area">
            <div class="room-title">
              <span>Salons</span>
              <button id="createRoomBtn">+</button>
            </div>

            <div id="roomList"></div>
          </div>
        </aside>

        <section class="chat-main">

          <div id="chatEmpty" class="chat-empty">
            <div>💬</div>
            <h2>Choisis une discussion</h2>
            <p>Tes messages restent enregistrés.</p>
          </div>

          <div id="chatWindow" class="hidden">

            <div class="chat-head">
              <button id="backChatBtn" class="mobile-only">←</button>
              <div>
                <strong id="chatTitle"></strong>
                <span id="typingIndicator"></span>
              </div>
            </div>

            <div id="messages" class="messages"></div>

            <form id="messageForm" class="message-form">
              <label class="attach">
                📎
                <input id="messageFile" type="file" hidden>
              </label>

              <input
                id="messageInput"
                autocomplete="off"
                placeholder="Écrire un message..."
              >

              <button>➤</button>
            </form>

          </div>

        </section>
      </div>

    </section>


    <section id="profilePage" class="page">

      <div id="profile"></div>

    </section>

  </main>


  <nav class="bottom-nav">

    <button data-page="homePage" class="nav active">
      <span>⌂</span>
      Accueil
    </button>

    <button data-page="storiesPage" class="nav">
      <span>◉</span>
      Stories
    </button>

    <button data-page="chatPage" class="nav">
      <span>💬</span>
      Discuter
    </button>

    <button data-page="profilePage" class="nav">
      <span>●</span>
      Profil
    </button>

  </nav>

</div>


<div id="modal" class="modal hidden">

  <div class="modal-box">

    <button id="closeModal" class="modal-close">×</button>

    <h2 id="modalTitle">Ajouter</h2>

    <div class="modal-options">

      <button id="chooseStory" class="option-card">
        <span>📸</span>
        <strong>Story</strong>
        <small>Ajouter une story permanente</small>
      </button>

      <button id="choosePost" class="option-card">
        <span>📝</span>
        <strong>Publication</strong>
        <small>Partager avec la communauté</small>
      </button>

    </div>

  </div>

</div>


<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>

</body>
</html>
