<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Veyra — Connexion</title>
  <link rel="stylesheet" href="/login.css">
</head>

<body>

<div class="auth">

  <div class="auth-brand">
    <div class="logo">V</div>
    <h1>Veyra</h1>
    <p>Ton espace social.</p>
  </div>

  <section id="loginBox" class="auth-card">

    <h2>Connexion</h2>
    <p>Retrouve ton espace Veyra.</p>

    <form id="loginForm">

      <label>
        Pseudo ou email
        <input
          id="identifier"
          required
          autocomplete="username"
        >
      </label>

      <label>
        Mot de passe
        <input
          id="password"
          type="password"
          required
          autocomplete="current-password"
        >
      </label>

      <button class="primary">
        Se connecter
      </button>

      <div id="loginError" class="error"></div>

    </form>

    <button id="showRegister" class="switch">
      Créer un compte
    </button>

  </section>


  <section id="registerBox" class="auth-card hidden">

    <h2>Créer ton compte</h2>
    <p>Bienvenue sur Veyra.</p>

    <form id="registerForm">

      <label>
        Pseudo
        <input id="registerUsername" required minlength="3">
      </label>

      <label>
        Email
        <input id="registerEmail" type="email" required>
      </label>

      <label>
        Âge
        <input id="registerAge" type="number" min="13" required>
      </label>

      <label>
        Mot de passe
        <input
          id="registerPassword"
          type="password"
          minlength="8"
          required
        >
      </label>

      <label class="check">
        <input id="privacy" type="checkbox" required>
        <span>J'accepte les règles de confidentialité.</span>
      </label>

      <button class="primary">
        Créer mon compte
      </button>

      <div id="registerError" class="error"></div>

    </form>

    <button id="showLogin" class="switch">
      J'ai déjà un compte
    </button>

  </section>

</div>

<script>
const loginBox = document.querySelector("#loginBox");
const registerBox = document.querySelector("#registerBox");

document.querySelector("#showRegister").onclick = () => {
  loginBox.classList.add("hidden");
  registerBox.classList.remove("hidden");
};

document.querySelector("#showLogin").onclick = () => {
  registerBox.classList.add("hidden");
  loginBox.classList.remove("hidden");
};

document.querySelector("#loginForm").onsubmit = async event => {
  event.preventDefault();

  const error = document.querySelector("#loginError");
  error.textContent = "";

  try {
    const response = await fetch("/api/auth/login", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        identifier: document.querySelector("#identifier").value.trim(),
        password: document.querySelector("#password").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Connexion impossible.");
    }

    location.href = "/";

  } catch (err) {
    error.textContent = err.message;
  }
};

document.querySelector("#registerForm").onsubmit = async event => {
  event.preventDefault();

  const error = document.querySelector("#registerError");
  error.textContent = "";

  try {
    const response = await fetch("/api/auth/register", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        username: document.querySelector("#registerUsername").value.trim(),
        email: document.querySelector("#registerEmail").value.trim(),
        age: Number(document.querySelector("#registerAge").value),
        password: document.querySelector("#registerPassword").value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Inscription impossible.");
    }

    location.href = "/";

  } catch (err) {
    error.textContent = err.message;
  }
};
</script>

</body>
</html>
