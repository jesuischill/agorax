<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agorex</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="app">

<header class="topbar">
  <div class="brand">
    <div class="logo">A</div>
    <span>AGOREX</span>
  </div>

  <div class="search">
    <input id="searchInput" placeholder="Rechercher sur Agorex...">
    <div id="searchResults" class="search-results"></div>
  </div>

  <div class="top-actions">
    <button id="notificationBtn">🔔</button>
    <button id="messagesBtn">💬</button>
    <button id="profileBtn">👤</button>
    <button id="logoutBtn">↪</button>
  </div>
</header>

<div class="layout">

<aside class="sidebar left">
  <button class="nav active" data-page="home">🏠 Accueil</button>
  <button class="nav" data-page="explore">🔎 Explorer</button>
  <button class="nav" data-page="stories">👻 Stories</button>
  <button class="nav" data-page="messages">💬 Messages</button>
  <button class="nav" data-page="notifications">🔔 Notifications</button>
  <button class="nav" data-page="profile">👤 Mon profil</button>

  <div class="side-user">
    <img id="sideAvatar" src="">
    <div>
      <strong id="sideUsername">...</strong>
      <small>Connecté</small>
    </div>
  </div>
</aside>

<main class="main">

<section id="storiesSection" class="card stories-card">
  <div class="section-title">
    <h2>Stories</h2>
    <button id="createStoryBtn">＋ Ma story</button>
  </div>

  <div id="stories" class="stories"></div>
</section>

<section class="card composer">
  <div class="composer-head">
    <img id="composerAvatar" src="">
    <textarea id="postText" maxlength="5000"
      placeholder="Quoi de neuf ?"></textarea>
  </div>

  <div id="imagePreview" class="image-preview"></div>

  <div class="composer-actions">
    <label class="file-button">
      🖼️ Image
      <input id="postImage" type="file" accept="image/*">
    </label>

    <button id="publishBtn" class="primary">
      Publier
    </button>
  </div>
</section>

<section class="feed-tabs">
  <button class="feed-tab active" data-sort="recent">Récent</button>
  <button class="feed-tab" data-sort="popular">Populaire</button>
</section>

<section id="feed"></section>

</main>

<aside class="sidebar right">

<div class="card mini-profile">
  <img id="profileAvatar" src="">
  <h2 id="profileUsername">...</h2>
  <p id="profileBio">Bienvenue sur Agorex.</p>
  <button id="editProfileBtn" class="primary">
    Modifier mon profil
  </button>
</div>

<div class="card">
  <h3>Agorex</h3>
  <p class="muted">
    Ton espace social pour partager,
    discuter et découvrir.
  </p>
</div>

</aside>

</div>

</div>

<!-- PROFILE MODAL -->

<div id="profileModal" class="modal hidden">
<div class="modal-box">

<div class="modal-head">
<h2>Modifier mon profil</h2>
<button data-close="profileModal">×</button>
</div>

<input id="bioInput" maxlength="300"
placeholder="Ta bio...">

<label class="upload-box">
Avatar
<input id="avatarInput" type="file" accept="image/*">
</label>

<label class="upload-box">
Bannière
<input id="bannerInput" type="file" accept="image/*">
</label>

<button id="saveProfileBtn" class="primary">
Enregistrer
</button>

</div>
</div>

<!-- STORY MODAL -->

<div id="storyModal" class="modal hidden">
<div class="modal-box">

<div class="modal-head">
<h2>Créer une story</h2>
<button data-close="storyModal">×</button>
</div>

<textarea id="storyText"
maxlength="1000"
placeholder="Ajoute quelque chose à ta story..."></textarea>

<label class="upload-box">
Image
<input id="storyImage" type="file" accept="image/*">
</label>

<button id="publishStoryBtn" class="primary">
Publier la story
</button>

</div>
</div>

<!-- STORY VIEWER -->

<div id="storyViewer" class="story-viewer hidden">
<button id="closeStoryViewer">×</button>
<img id="storyViewerImage">
<div id="storyViewerText"></div>
</div>

<!-- MESSAGES -->

<div id="messagesPanel" class="messages-panel hidden">

<div class="messages-list">
<div class="messages-title">
<h2>Messages</h2>
</div>
<div id="conversationList"></div>
</div>

<div class="conversation">
<div id="conversationHeader" class="conversation-header">
Sélectionne une discussion
</div>

<div id="privateMessages" class="private-messages"></div>

<div id="typingIndicator"></div>

<form id="privateForm" class="message-form">
<input id="privateInput"
autocomplete="off"
placeholder="Écrire un message...">
<button>➤</button>
</form>
</div>

</div>

<!-- NOTIFICATIONS -->

<div id="notificationsPanel" class="dropdown-panel hidden">
<h3>Notifications</h3>
<div id="notifications"></div>
</div>

<!-- PUBLIC CHAT -->

<button id="publicChatToggle" class="chat-button">
💬 Chat public
</button>

<section id="publicChat" class="public-chat hidden">

<div class="chat-header">
<strong>Chat public</strong>
<button id="closePublicChat">×</button>
</div>

<select id="publicRoom">
<option value="general">Général</option>
<option value="gaming">Gaming</option>
<option value="musique">Musique</option>
<option value="entraide">Entraide</option>
</select>

<div id="publicMessages" class="chat-messages"></div>

<form id="publicChatForm" class="message-form">
<input id="publicChatInput"
maxlength="1000"
placeholder="Message public...">
<button>➤</button>
</form>

</section>

<div id="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>

</body>
</html>
