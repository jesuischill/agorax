<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Veyra</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/style.css">
</head>

<body>

<div id="app">

  <header class="topbar">

    <button class="brand" data-page="home">
      <span class="brand-icon">V</span>
      <span>Veyra</span>
    </button>

    <div class="top-actions">
      <button id="topSearch" class="icon-button">⌕</button>
      <button id="topProfile" class="avatar-button">?</button>
    </div>

  </header>

  <main>

    <!-- ACCUEIL -->

    <section id="page-home" class="page active">

      <div class="page-title">
        <div>
          <span class="eyebrow">TON ESPACE</span>
          <h1>Accueil</h1>
        </div>

        <button id="newPostTop" class="primary-small">
          + Publier
        </button>
      </div>

      <div class="stories-wrap">

        <div class="section-head">
          <h2>Stories</h2>
          <button id="openStories">Voir tout</button>
        </div>

        <div id="stories" class="stories"></div>

      </div>

      <div class="composer">

        <div id="composerAvatar" class="avatar">V</div>

        <button id="composerButton">
          Quoi de neuf ?
        </button>

        <button id="composerFile">📎</button>

      </div>

      <input id="composerFileInput" type="file" hidden>

      <div id="feed" class="feed"></div>

    </section>


    <!-- STORIES -->

    <section id="page-stories" class="page">

      <div class="page-title">
        <div>
          <span class="eyebrow">24 HEURES</span>
          <h1>Stories</h1>
        </div>

        <button id="createStory" class="primary-small">
          + Story
        </button>
      </div>

      <div id="storiesFull" class="story-grid"></div>

    </section>


    <!-- DISCUSSIONS -->

    <section id="page-chat" class="page">

      <div id="conversationView">

        <div class="page-title">

          <div>
            <span class="eyebrow">MESSAGES</span>
            <h1>Discuter</h1>
          </div>

          <button id="newConversation" class="circle-button">
            +
          </button>

        </div>

        <div class="search-box">
          <span>⌕</span>
          <input
            id="chatSearch"
            placeholder="Rechercher une personne..."
          >
        </div>

        <div id="chatSearchResults" class="search-results"></div>

        <div id="conversations" class="conversations"></div>

      </div>


      <div id="privateChat" class="chat-screen hidden">

        <div class="chat-header">

          <button id="closePrivate" class="back-button">
            ←
          </button>

          <div id="privateAvatar" class="avatar">V</div>

          <div class="chat-user-info">
            <strong id="privateName">Utilisateur</strong>
            <span id="privateStatus">hors ligne</span>
          </div>

        </div>

        <div id="privateMessages" class="messages"></div>

        <div id="typingPrivate" class="typing hidden">
          écrit…
        </div>

        <div class="message-composer">

          <input
            id="privateInput"
            placeholder="Écrire un message..."
            autocomplete="off"
          >

          <label class="attach">
            📎
            <input id="privateFile" type="file" hidden>
          </label>

          <button id="privateSend">➤</button>

        </div>

      </div>

    </section>


    <!-- PUBLIC -->

    <section id="page-public" class="page">

      <div class="page-title">
        <div>
          <span class="eyebrow">COMMUNAUTÉ</span>
          <h1>Public</h1>
        </div>
      </div>

      <div id="publicMessages" class="messages public-messages"></div>

      <div class="message-composer">

        <input
          id="publicInput"
          placeholder="Message public..."
          autocomplete="off"
        >

        <label class="attach">
          📎
          <input id="publicFile" type="file" hidden>
        </label>

        <button id="publicSend">➤</button>

      </div>

    </section>


    <!-- PROFIL -->

    <section id="page-profile" class="page">

      <div id="profile"></div>

    </section>


    <!-- RECHERCHE -->

    <section id="page-search" class="page">

      <div class="page-title">

        <div>
          <span class="eyebrow">EXPLORER</span>
          <h1>Recherche</h1>
        </div>

      </div>

      <div class="big-search">

        <span>⌕</span>

        <input
          id="globalSearch"
          placeholder="Chercher un pseudo..."
        >

      </div>

      <div id="globalResults" class="user-results"></div>

    </section>

  </main>


  <!-- NAVIGATION -->

  <nav class="bottom-nav">

    <button data-page="home" class="nav-item active">
      <span>⌂</span>
      <small>Accueil</small>
    </button>

    <button data-page="stories" class="nav-item">
      <span>◉</span>
      <small>Stories</small>
    </button>

    <button data-page="chat" class="nav-item">
      <span>▣</span>
      <small>Discuter</small>
    </button>

    <button data-page="public" class="nav-item">
      <span>◎</span>
      <small>Public</small>
    </button>

    <button data-page="profile" class="nav-item">
      <span id="navAvatar">?</span>
      <small>Profil</small>
    </button>

  </nav>


  <!-- MODAL PUBLICATION -->

  <div id="postModal" class="modal hidden">

    <div class="modal-card">

      <button class="modal-close" data-close="postModal">×</button>

      <span class="eyebrow">NOUVELLE PUBLICATION</span>
      <h2>Partager</h2>

      <textarea
        id="postText"
        placeholder="Écris quelque chose..."
      ></textarea>

      <div id="postPreview" class="file-preview"></div>

      <label class="upload-button">
        📎 Ajouter un fichier
        <input id="postFile" type="file" hidden>
      </label>

      <button id="publishPost" class="primary">
        Publier
      </button>

    </div>

  </div>


  <!-- MODAL STORY -->

  <div id="storyModal" class="modal hidden">

    <div class="modal-card">

      <button class="modal-close" data-close="storyModal">×</button>

      <span class="eyebrow">NOUVELLE STORY</span>
      <h2>Partager maintenant</h2>

      <textarea
        id="storyText"
        placeholder="Un message..."
      ></textarea>

      <label class="upload-button">
        📸 Choisir une photo ou un fichier
        <input id="storyFile" type="file" accept="image/*,video/*" hidden>
      </label>

      <div id="storyPreview" class="file-preview"></div>

      <button id="publishStory" class="primary">
        Publier la story
      </button>

    </div>

  </div>


  <div id="toast" class="toast"></div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/app.js"></script>

</body>
</html>
